<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraLover - Авторизация</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .auth-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-primary { background: #ff4b72; color: white; }
        .btn-google { background: #4285F4; color: white; }
        .btn-phone { background: #34A853; color: white; }
        .divider {
            margin: 20px 0;
            position: relative;
            text-align: center;
        }
        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 1px solid #ddd;
            z-index: 1;
        }
        .divider span {
            background: white;
            padding: 0 10px;
            color: #888;
            position: relative;
            z-index: 2;
            font-size: 14px;
        }
        .hidden { display: none; }
        #message { margin-top: 15px; font-size: 14px; color: #ff4b72; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>Вход в AuraLover</h2>
    
    <!-- Секция Email / Password -->
    <div class="input-group">
        <input type="email" id="email" placeholder="Email">
    </div>
    <div class="input-group">
        <input type="password" id="password" placeholder="Пароль">
    </div>
    <button class="btn-primary" id="btn-email-login">Войти / Создать по Email</button>

    <div class="divider"><span>ИЛИ</span></div>

    <!-- Секция Google -->
    <button class="btn-google" id="btn-google">Войти через Google</button>

    <!-- Секция Телефона -->
    <button class="btn-phone" id="btn-phone-start">Войти по номеру телефона</button>
    
    <div id="phone-auth-section" class="hidden">
        <div class="input-group">
            <input type="tel" id="phone-number" placeholder="+7 999 000 00 00">
        </div>
        <button class="btn-phone" id="btn-send-code">Отправить SMS</button>
        
        <div id="code-section" class="hidden">
            <div class="input-group">
                <input type="text" id="verification-code" placeholder="Код из SMS">
            </div>
            <button class="btn-primary" id="btn-verify-code">Подтвердить код</button>
        </div>
    </div>

    <!-- Контейнер для невидимой капчи (нужен для телефона) -->
    <div id="recaptcha-container"></div>
    
    <!-- Вывод ошибок и сообщений -->
    <div id="message"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
    import { 
        getAuth, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        RecaptchaVerifier,
        signInWithPhoneNumber
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCT0YGzfb0Z2SHfafkMmuhbj0MdqkrRGDk",
        authDomain: "auralover.firebaseapp.com",
        databaseURL: "https://auralover-default-rtdb.firebaseio.com",
        projectId: "auralover",
        storageBucket: "auralover.firebasestorage.app",
        messagingSenderId: "626796547748",
        appId: "1:626796547748:web:fd401e5985875c64fca031",
        measurementId: "G-XV5YN3Z9KH"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const messageEl = document.getElementById('message');

    function showMessage(text) {
        messageEl.innerText = text;
        console.log(text);
    }

    // Вход по Email
    document.getElementById('btn-email-login').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if(!email || !password) return showMessage("Введите email и пароль");

        signInWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
                showMessage(`Успешный вход! Привет, ${userCredential.user.email}`);
            })
            .catch((error) => {
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    createUserWithEmailAndPassword(auth, email, password)
                        .then((userCredential) => {
                            showMessage(`Профиль создан! Привет, ${userCredential.user.email}`);
                        })
                        .catch((err) => showMessage("Ошибка регистрации: " + err.message));
                } else {
                    showMessage("Ошибка входа: " + error.message);
                }
            });
    });

    // Вход через Google
    document.getElementById('btn-google').addEventListener('click', () => {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider)
            .then((result) => {
                showMessage(`Успешный вход через Google! Привет, ${result.user.displayName}`);
            }).catch((error) => {
                showMessage("Ошибка Google авторизации: " + error.message);
            });
    });

    // Вход по телефону
    document.getElementById('btn-phone-start').addEventListener('click', () => {
        document.getElementById('phone-auth-section').classList.remove('hidden');
        document.getElementById('btn-phone-start').classList.add('hidden');
        
        if(!window.recaptchaVerifier) {
            window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                'size': 'invisible'
            });
        }
    });

    let confirmationResult;

    document.getElementById('btn-send-code').addEventListener('click', () => {
        const phoneNumber = document.getElementById('phone-number').value;
        if(!phoneNumber) return showMessage("Введите номер телефона");

        const appVerifier = window.recaptchaVerifier;
        
        signInWithPhoneNumber(auth, phoneNumber, appVerifier)
            .then((result) => {
                confirmationResult = result;
                document.getElementById('code-section').classList.remove('hidden');
                showMessage("SMS с кодом отправлено!");
            }).catch((error) => {
                showMessage("Ошибка отправки SMS: " + error.message);
                if(window.recaptchaVerifier) window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId));
            });
    });

    document.getElementById('btn-verify-code').addEventListener('click', () => {
        const code = document.getElementById('verification-code').value;
        if(!code) return showMessage("Введите код из SMS");

        confirmationResult.confirm(code).then((result) => {
            const user = result.user;
            showMessage(`Успешный вход по телефону! Ваш номер: ${user.phoneNumber}`);
        }).catch((error) => {
            showMessage("Неверный код! Ошибка: " + error.message);
        });
    });
</script>
</body>
</html>
